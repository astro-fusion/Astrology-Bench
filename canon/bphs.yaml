  - id: bphs.santhanam1984.ch37.v7-10
    text: "BPHS"
    edition: santhanam1984
    chapter: "37"
    verse: "7-10"
    topic: yoga
    rule_key: sunapha
    rule_keys: [sunapha, anapha, durudhara]
    statement: "A planet other than the Sun in the 2nd from the Moon causes Sunapha yoga. A planet other than the Sun in the 12th from the Moon causes Anapha yoga. Planets (other than the Sun) in both the 2nd and 12th from the Moon cause Durudhara yoga (spelt Duradhara by Santhanam)."
    quote: "If there is a planet, other than the Sun, in the 2nd from the Moon Sunapha yoga, in the 12th Anapha yoga and planets in both places Duradhara yoga are caused."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
