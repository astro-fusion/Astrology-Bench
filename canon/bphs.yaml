  - id: bphs.santhanam1984.ch39.v6-7
    text: "BPHS"
    edition: santhanam1984
    chapter: "39"
    verse: "6-7"
    topic: yoga
    rule_key: raja_yoga_kendra_trikona
    rule_keys: [raja_yoga_kendra_trikona, parivartana]
    statement: "If the ascendant lord (a kendra and trikona lord) and the 5th lord exchange signs, a Maha Raja yoga is produced. Exchange of signs between the ascendant lord and the 5th lord produces Maha Raja yoga."
    quote: "exchange their signs or if Atmakaraka and Putra Karaka (Chara) are in the ascendant, the 5th, exaltation sign, own sign or own Navamsha in aspect to a benefice, Maha Raja yoga is produced."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
