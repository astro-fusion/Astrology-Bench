  - id: bphs.santhanam1984.ch36.v25-26
    text: "BPHS"
    edition: santhanam1984
    chapter: "36"
    verse: "25-26"
    topic: yoga
    rule_key: parivartana
    statement: "An exchange of signs between the lords of the 2nd and 9th, with the ascendant lord in an angle or trine, gives Khadga yoga."
    quote: "Should there be an exchange of signs between the lords of the 2nd and the 9th as the ascendant lord is in an angle or in a trine Khadga yoga is obtainable."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
