  - id: bphs.santhanam1984.ch3.v49-50
    text: "BPHS"
    edition: santhanam1984
    chapter: "3"
    verse: "49-50"
    topic: dignity
    rule_key: exaltation_degrees
    rule_keys: [exaltation_degrees, debilitation_degrees]
    statement: "The seven planets from the Sun are exalted in Aries, Taurus, Capricorn, Virgo, Cancer, Pisces and Libra, with deepest exaltation at 10, 3, 28, 15, 5, 27 and 20 degrees. Each planet is debilitated in the seventh sign from its exaltation sign, at the same degree as its deepest exaltation."
    quote: "The deepest exaltation degrees are respectively 10, 3, 28, 15, 5, 27 and 20 in those signs. And in the seventh sign from the said exaltation sign each planet has its own debilitation."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    also_in:
      - {text: "Brihat Jataka", chapter: "1", verse: "13"}
      - {text: "Saravali", chapter: "3", verse: "35-36"}
    dispute: "Iyer's table note to Brihat Jataka 1.13 prints 29 for Mars while the stanza text and BPHS give 28; read as an elapsed-versus-current degree convention, not a different rule."
  - id: bphs.santhanam1984.ch3.v51-54
    text: "BPHS"
    edition: santhanam1984
    chapter: "3"
    verse: "51-54"
    topic: dignity
    rule_key: moolatrikona
    statement: "The Sun's Moola-Trikona is the first 20 degrees of Leo; the remainder of Leo is his own sign (the verse sets out the other planets likewise)."
    quote: "In Leo, the first 20 degrees are the Sun's Moola-Trikona while the rest is his own house."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    also_in:
      - {text: "Brihat Jataka", chapter: "1", verse: "14"}
    dispute: "Brihat Jataka 1.14 lists Moola-Trikona signs only (Leo, Taurus, Aries, Virgo, Sagittarius, Libra, Aquarius) without the degree splits that BPHS gives."
