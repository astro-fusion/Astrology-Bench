    text: "BPHS"
    edition: santhanam1984
    chapter: "6"
    verse: "10-11"
    topic: varga
    rule_key: saptamsa_d7
    statement: "Saptamsa counting begins from the sign itself for odd signs and from the 7th sign for even signs."
    quote: "counting commences from the same sign in the case of an odd sign. It is from the seventh sign thereof while an even sign is considered."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
