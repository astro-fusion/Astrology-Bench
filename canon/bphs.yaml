  - id: bphs.santhanam1984.ch46.v12-14
    text: "BPHS"
    edition: santhanam1984
    chapter: "46"
    verse: "12-14"
    topic: nakshatra
    rule_key: nakshatra_lords
    rule_keys: [nakshatra_lords, vimshottari_order]
    statement: "Dasha lordship by nakshatra runs from Krittika: Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury, Ketu, Venus, repeating through the 27 nakshatras. The Vimshottari order is Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury, Ketu, Venus."
    quote: "Beginning from Krittika the lords of Dasha (periods) are the Sun, the Moon, Mars, Rahu, Jupiter, Saturn, Mercury, Ketu and Venus in that order,"
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
  - id: bphs.santhanam1984.ch46.v15
    text: "BPHS"
    edition: santhanam1984
    chapter: "46"
    verse: "15"
    topic: dasha
    rule_key: vimshottari_dasha_years
    statement: "The Vimshottari periods for Sun, Moon, Mars, Rahu, Jupiter, Saturn, Mercury, Ketu and Venus are 6, 10, 7, 18, 16, 19, 17, 7 and 20 years."
    quote: "The period, of Dasha of the Sun, the Moon, Mars, Rahu, Jupiter, Saturn, Mercury. Ketu and Venus are 6, 10, 7, 18, 16, 19, 17, 7 and 20 in that order."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
