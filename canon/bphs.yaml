  - id: bphs.santhanam1984.ch3.v55
    text: "BPHS"
    edition: santhanam1984
    chapter: "3"
    verse: "55"
    topic: dignity
    rule_key: planetary_friendship
    statement: "Natural friendship is derived from the Moola-Trikona sign: the lords of the 4th, 2nd, 12th, 5th, 9th and 8th signs from it are friends, apart from the lord of the exaltation sign."
    quote: "Note the signs which are the 4th, 2nd, 12th, 5th, 9th and the 8th from the Moola-Trikona of a planet. The planets ruling such signs are its friends, apart from the lord of its exaltation sign."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    also_in:
      - {text: "Saravali", chapter: "4", verse: "28-29"}
    dispute: "Saravali 4.28-29 lists friendships planet by planet; BPHS gives a derivation formula. The two are reported by Santhanam as broadly consistent but not identical for every pair (e.g. Mercury and the Moon); the generator should accept either citation only for pairs both state."
  - id: bphs.santhanam1984.ch7.v28-29
    text: "BPHS"
    edition: santhanam1984
    chapter: "7"
    verse: "28-29"
    topic: combustion
    rule_key: combustion_orbs
    statement: "Combustion orbs from the Sun in direct and retrograde motion (Moon 12, Mars 17 and 8, Mercury 14 and 12, Jupiter 11 and 11, Venus 10 and 8, Saturn 16 and 16 degrees)."
    quote: "Planet Combustion in direct motion Combustion in (R) motion Moon 12° ~ Mars 17° 8° Mercury 14° 12° Jupiter 11° 11° Venus 10° 8° Saturn 16° 16°"
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    dispute: "The source is a table linearised by OCR; read the columns in the printed page. Santhanam notes that Rahu and Ketu are not treated as combust."
  - id: bphs.santhanam1984.ch26.v2-5
    text: "BPHS"
    edition: santhanam1984
    chapter: "26"
    verse: "2-5"
    topic: aspect
    rule_key: graha_drishti
    statement: "All planets aspect the 7th fully; Saturn, Jupiter and Mars additionally aspect fully the 3rd and 10th, the 5th and 9th, and the 4th and 8th respectively."
    quote: "All planets aspect the 7th fully. Saturn, Jupiter and Mars have special aspects respectively on 3rd and 10th, 5th and 9th, and 4th and 8th."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
