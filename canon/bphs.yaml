  - id: bphs.santhanam1984.ch6.v13-14
    text: "BPHS"
    edition: santhanam1984
    chapter: "6"
    verse: "13-14"
    topic: varga
    rule_key: dasamsa_d10
    statement: "Dashamsa counting begins from the sign itself for odd signs and from the 9th for even signs, each part being 3 degrees."
    quote: "Starting from the same sign for an odd sign and from the 9th with reference to an even sign, the 10 Dashamsas each of 3° are reckoned."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
