    text: "BPHS"
    edition: santhanam1984
    chapter: "6"
    verse: "12"
    topic: varga
    rule_key: navamsa_d9
    statement: "Navamsha counting begins from the sign itself for movable signs, from the 9th for fixed signs and from the 5th for dual signs."
    quote: "The Navamsha calculation are for a movable sign from there itself, for a fixed sign from the 9th thereof and for a dual sign from the 5th thereof."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
