  - id: bphs.santhanam1984.ch36.v3-4
    text: "BPHS"
    edition: santhanam1984
    chapter: "36"
    verse: "3-4"
    topic: yoga
    rule_key: gaja_kesari
    statement: "Jupiter in an angle from the ascendant or the Moon, joined or aspected by a benefic and free of debilitation, combustion and inimical sign, causes Gaja Kesari yoga."
    quote: "Should Jupiter be in an angle from the ascendant or from the Moon, and be conjunct or aspected by (another) benefice, avoiding at the same time debilitation, combustion and inimical sign, Gaja Kesari yoga is caused."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    dispute: "Santhanam's notes to this verse record that other texts (Jataka Parijata, Kumara Swameeyam, the Bombay edition) define Gaja Kesari differently, usually as Jupiter in a kendra from the Moon alone."
  - id: bphs.santhanam1984.ch36.v5-6
    text: "BPHS"
    edition: santhanam1984
    chapter: "36"
    verse: "5-6"
    topic: yoga
    rule_key: amala
    statement: "A benefic exclusively in the 10th from the ascendant or the Moon forms Amala yoga."
    quote: "If there be exclusively a benefice in the 10th from the ascendant or the Moon, Amala yoga exists."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
