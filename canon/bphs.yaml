  - id: bphs.santhanam1984.ch34.v2-7
    text: "BPHS"
    edition: santhanam1984
    chapter: "34"
    verse: "2-7"
    topic: lordship
    rule_key: house_lordship_kendra_trikona
    statement: "The lord of a trine gives auspicious results; the lord of the ascendant, being both angle and trine, is especially auspicious; benefics owning angles lose their benefic effect."
    quote: "The lord of a trine will give auspicious results. The lord of the ascendant is especially auspicious as the ascendant is an angle as well as trine."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
