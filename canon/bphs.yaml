    edition: santhanam1984
    chapter: "39"
    verse: "28"
    topic: yoga
    rule_key: vipareeta_raja
    statement: "Even if one of the 6th, 8th and 12th lords in debilitation aspects the ascendant, a Raja yoga results."
    quote: "Even if one among the 6th, 8th and 12th lords being in debilitation aspects the ascendant there will be a Raja yoga."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
