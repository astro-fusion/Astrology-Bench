      - {text: "Phaladeepika", chapter: "6", verse: "5"}
      - {text: "Saravali", chapter: "13", verse: "2"}
    dispute: "Texts disagree on the cancellation: Brihat Jataka 13.3 reports some authors (Garga, Parasara) saying the yoga fails when the Moon is in a kendra or has a companion; BPHS (Santhanam) counts planets in an angle from the ascendant as cancelling; Saravali 13.2 counts planets in the Moon's angles or the Moon being unaspected."
  - id: bphs.santhanam1984.ch75.v1-2
    text: "BPHS"
    edition: santhanam1984
    chapter: "75"
    verse: "1-2"
    topic: yoga
    rule_key: pancha_mahapurusha
    statement: "Mars, Mercury, Jupiter, Venus and Saturn in own or exaltation sign in a kendra from the ascendant form Ruchaka, Bhadra, Hamsa, Malavya and Sasa yogas respectively."
    quote: "When Mars, Mercury, Jupiter, Venus and Saturn being in their own sign or in their sign of exaltation, be in Kendra to the Ascendant, they give rise to Ruchaka, Bhadra, Hamsa, Malayya and Sasa yogas respectively."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
