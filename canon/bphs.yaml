    edition: santhanam1984
    chapter: "6"
    verse: "7-8"
    topic: varga
    rule_key: drekkana_d3
    statement: "The three drekkanas of a sign are its 1st, 5th and 9th signs."
    quote: "The 1st, 5th and the 9th Rashis from a sign are its three decanates, and are respectively lorded by Narada, Agasthya and Doorvasa."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
