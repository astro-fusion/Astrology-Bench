    verified_at: "2026-11-08"
    also_in:
      - {text: "Brihat Samhita", chapter: "69", verse: "1"}
      - {text: "Phaladeepika", chapter: "6", verse: "1"}
    dispute: "BPHS spells the fourth yoga Malayya and Brihat Samhita (Iyer) gives Rucaka with a query; Brihat Samhita 69.1 says \"kendras\" without \"from the ascendant\"."
  - id: bphs.santhanam1984.ch39.v28
