  - id: bphs.santhanam1984.ch37.v11-13
    text: "BPHS"
    edition: santhanam1984
    chapter: "37"
    verse: "11-13"
    topic: yoga
    rule_key: kemadruma
    statement: "With no planet (excluding the Sun) with the Moon, in the 2nd or 12th from it, or in an angle from the ascendant, Kemadruma yoga is formed."
    quote: "Excluding the Sun, should there be no planet with the Moon or in the 2nd/12th from the Moon or in an angle from the ascendant, Kemadruma yoga is formed."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
