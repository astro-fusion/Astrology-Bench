    text: "BPHS"
    edition: santhanam1984
    chapter: "6"
    verse: "5-6"
    topic: varga
    rule_key: hora_d2
    statement: "In an odd sign the first half is the Sun's hora and the second the Moon's; the order reverses in an even sign."
    quote: "The first half of an old sign is the Hora ruled by the Sun while the second half is the Hora of the Moon. The reverse is true in the case of an even sign."
    url: "https://archive.org/stream/brihatparasarahorashastrabyr.santhanam/Brihat%20Par%C4%81%C5%9Bara%20Hor%C4%81%20%C5%9Ah%C4%81stra%20By%20R.%20Santhanam_djvu.txt"
