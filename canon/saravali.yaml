    chapter: "3"
    verse: "35-36"
    topic: dignity
    rule_key: exaltation_degrees
    rule_keys: [exaltation_degrees, debilitation_degrees]
    statement: "The planets are exalted in Aries, Taurus, Capricorn, Virgo, Cancer, Pisces and Libra and deeply exalted at 10, 3, 28, 15, 5, 27 and 20 degrees. The signs opposite the exaltation signs are the places of debilitation, at the same degrees."
    quote: "These are deeply exalted at 10, 3, 28, 15, 5, 27 and 20 Degrees in the respective Rasis. The Rasis opposite exaltation are the places of debilitation for the planets concerned. And the respective degrees are of deep fall."
