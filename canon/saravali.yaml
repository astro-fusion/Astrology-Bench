  - id: saravali.santhanam1983.ch15.v8
    text: "Saravali"
    edition: santhanam1983
    chapter: "15"
    verse: "8"
    topic: yoga
    rule_key: chandra_mangala
    statement: "The Moon and Mars together make the native valorous and brave in war, an artisan and metallurgist (the conjunction effect; the later wealth-giving Chandra-Mangala yoga is not stated)."
    quote: "One, who has the Moon and Mars together, will be valorous, brave in war, be a boxer, will suffer bloody imbalances, or diseases,"
