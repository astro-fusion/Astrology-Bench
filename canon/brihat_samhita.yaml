    topic: yoga
    rule_key: pancha_mahapurusha
    statement: "Mars, Mercury, Jupiter, Venus and Saturn, strong and in own or exaltation sign in kendras, give birth to the five great men."
    quote: "When the five non-luminaries viz. Mars, Mercury, Jupiter, Venus and Saturn, possessed of strength, occupy their own or exaltation signs identical with kendras (1st, 4th, 7th and 10th houses), five illustrious personages (pañca-puruṣa) are born."
