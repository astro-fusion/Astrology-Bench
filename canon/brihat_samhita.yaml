    verse: "24"
    topic: mundane
    rule_key: eclipse_effects
    statement: "Eclipses occurring before the calculated times bring miscarriage of pregnancy and wars; after the calculated times they bring loss of flowers and fruits and fear."
    quote: "If the eclipses should occur before the calculated times, there will be miscarriage of pregnancy and wars in the land;"
