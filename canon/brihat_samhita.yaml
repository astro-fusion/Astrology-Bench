    statement: "Earthquakes occurring when the Moon is in Uttaraphalguni, Hasta, Chitra, Swati, Punarvasu, Mrigashira or Ashwini belong to the circle of Vayu."
    quote: "The asterisms of Uttaraphālguni, Hasta, Citrā, Svāti, Punarvasu, Mṛgaśīrṣa and Aśvinī are known as the circle or division of Vāyu."
