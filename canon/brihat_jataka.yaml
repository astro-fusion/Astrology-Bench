    rule_key: budha_aditya
    statement: "The Sun and Mercury in one sign make the native skilled, intelligent, famous and comfortable (the conjunction effect; the name Budha-Aditya is not used)."
    quote: "if the Sun and Mercury occupy a sign together, the person will be skilled in work, will be intelligent and famous, and will live in comfort;"
    url: "https://chestofbooks.com/new-age/astrology/Brihat-Jataka/Chapter-XIV-On-Double-Planetary-Yogas.html"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    dispute: "The classical text gives the effect of the Sun-Mercury conjunction but not the later name Budha-Aditya; only the conjunction is attested here and no cancellation conditions are stated."
