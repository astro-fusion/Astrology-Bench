    rule_keys: [exaltation_degrees, debilitation_degrees]
    statement: "Aries, Taurus, Capricorn, Virgo, Cancer, Pisces and Libra are the exaltation signs of the Sun to Saturn, at 10, 3, 28, 15, 5, 27 and 20 degrees; the opposite signs are the depression signs. The 7th (opposite) signs are the depression signs and the degrees of main depression equal those of exaltation."
    quote: "The 10th, 3rd, 28th, 15th, 5th, 27th, and 20th are the degrees of main exaltation of the several planets. The 7th or opposite signs are the Neecha (depression) signs;"
