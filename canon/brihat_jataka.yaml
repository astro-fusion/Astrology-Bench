  - id: brihat_jataka.iyer1905.ch13.v3
    text: "Brihat Jataka"
    edition: iyer1905
    chapter: "13"
    verse: "3"
    topic: yoga
    rule_key: sunapha
    rule_keys: [sunapha, anapha, durudhara, kemadruma]
    statement: "Planets other than the Sun in the 2nd, the 12th or both from the Moon give Sunapha, Anapha and Durudhura yogas respectively. Planets other than the Sun in the 12th from the Moon give Anapha yoga. Planets other than the Sun in both the 2nd and 12th from the Moon give Durudhura yoga (spelt Puru-dhura in the Iyer text). Where none of the 2nd/12th arrangements holds, the yoga is known as Kemadruma."
    quote: "if the other planets occupy the 2nd, the 12th, or both the 2nd and the 12th houses from the Moon, the yogas are respectively known as Sunapha, Anapha or Durudhura; otherwise (a), the yoga is known as Kemadruma"
    url: "https://chestofbooks.com/new-age/astrology/Brihat-Jataka/Chapter-XIII-On-Chandra-Yogas-Lunar-Yogas.html"
    verified: quoted
    verified_by: astro-bench B-2 agent
