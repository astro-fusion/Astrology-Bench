  - id: phaladeepika.sastri1950.ch7.v26
    text: "Phaladeepika"
    edition: sastri1950
    chapter: "7"
    verse: "26"
    topic: yoga
    rule_key: neecha_bhanga
    statement: "A planet in depression whose sign lord, or the lord of its exaltation sign, is in a kendra from the Moon or the Lagna makes the native a king and just ruler."
    quote: "if the lord of the sign of depression or that of the planet's exaltation Rasi be in a Kendra position with respect to the Moon's place or the Lagna"
    url: "https://archive.org/stream/Phaladeepika2ndEd.1950ByVSubrahmanyaSastri/Phaladeepika%202nd%20Ed.%201950%20by%20V%20Subrahmanya%20Sastri_djvu.txt"
    verified: quoted
    verified_by: astro-bench B-2 agent
    verified_at: "2026-11-08"
    dispute: "Sastri's note on this sloka records that some read \"the lord of the planet's exaltation Rasi\" as the planet exalted in that sign. Other cancellation rules in common use (for example the debilitated planet in a kendra) are not in this sloka."
