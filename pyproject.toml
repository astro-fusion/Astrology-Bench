[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-bench"
version = "0.1.0"
description = "Open benchmark for classical-rule fidelity of AI models in Vedic astrology"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Astro-Bench contributors" }]
dependencies = [
    # The oracle engine, pinned by commit (ADR-001). Bump only with a re-generated dev split.
    "vedic-astrology-core @ git+https://github.com/astro-fusion/astro_research-white-paper.git@24d048b",
    "pydantic>=2,<3",
    "PyYAML>=6.0,<7",
    "numpy>=1.21",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "types-PyYAML"]
eval = ["inspect-ai>=0.3"]

[project.scripts]
astro-bench = "astro_bench.cli:main"

[tool.setuptools.packages.find]
include = ["astro_bench*"]

[tool.setuptools.package-data]
astro_bench = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["node_modules", "src", "vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
packages = ["astro_bench"]
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["vedic_astrology_core.*", "swisseph", "inspect_ai", "inspect_ai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
