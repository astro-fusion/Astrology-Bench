id: general.gaja_kesari.classical
version: 2
name: Gaja Kesari Yoga (BPHS definition)
domain: general
claim: >-
  Jupiter in a kendra from the Lagna or the Moon, joined or aspected by a benefic, and not
  debilitated, combust or in an enemy's sign, gives a splendid, wealthy and lasting reputation.
source:
  text: Brihat Parashara Hora Shastra
  chapter: '36'
  verse: 3-4
  edition: R. Santhanam tr., Ranjan Publications
  note: >-
    Gaja Kesari is the first yoga of the chapter on various yogas (Nana Yoga). Chapter and
    verse numbering differ between editions; check against yours.
author: astro-research
tier: classical
conditions:
  all:
    - any:
        - in_kendra_from:
            planet: Jupiter
            from: Moon
        - in_kendra_from:
            planet: Jupiter
            from: Lagna
    - any:
        - graha_drishti:
            planet: Mercury
            target: Jupiter
        - graha_drishti:
            planet: Venus
            target: Jupiter
        - in_house_from:
            planet: Mercury
            from: Jupiter
            houses:
              - 1
        - in_house_from:
            planet: Venus
            from: Jupiter
            houses:
              - 1
    - not:
        dignity_in:
          planet: Jupiter
          dignities:
            - debilitation
            - enemy
    - not:
        combust:
          planet: Jupiter
