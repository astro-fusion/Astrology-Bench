notes:
  benefics: >-
    Mercury and Venus are taken as the benefics. The Moon (a benefic when waxing) is not included
    yet; a waxing-Moon condition can be added with moon_phase.
  enemy: >-
    'Enemy sign' uses natural friendship (naisargika maitri) to the sign lord: Jupiter's enemies
    are Mercury and Venus, so Gemini, Virgo, Taurus and Libra.
