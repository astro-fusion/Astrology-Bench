id: financial.practitioner.vyapar_ratna_inverse_dignity_gold
version: 2
name: 'Vyapar Ratna inverse law: gold falls when the Sun or Jupiter is exalted, in own or friendly sign'
domain: financial
claim: When a commodity's significator (Sun or Jupiter for gold) transits its exaltation, own or a friendly
  sign, supply is abundant and the price falls (mandi); in debilitation, an enemy sign or combust, scarcity
  drives the price up (teji).
source:
  url: https://www.astrocapitalx.com/commodity-astrology
  text: 'AstroCapitalX, "Commodity astrology: gold, silver and crude oil in the Vedic tradition" (n.d.)'
  note: 'Practitioner statement; the page has not yet been opened by a maintainer (checked: false).'
author: astro-research practitioner extraction (2026-11-08)
tier: experimental
status: active
window:
  unit: months
  before: $window_before
  after: $window_after
  note: for the length of the sign transit
expected_effect:
  series: gold_usd
  direction: down
params:
  window_before: {value: 0, min: 0, max: 3, step: 1, unit: months}
  window_after: {value: 1, min: 0, max: 2, step: 1, unit: months}
conditions:
  any:
  - dignity_in:
      planet: Sun
      dignities:
      - exaltation
      - own
      - moolatrikona
      - friend
  - dignity_in:
      planet: Jupiter
      dignities:
      - exaltation
      - own
      - moolatrikona
      - friend
