- moment: '2024-07-15T00:00:00Z'
  expect: silent
  note: 'Mercury direct. Engine: retrograde(planet=Mercury): Mercury moves +1.271 deg/day, so it is direct.'
  verified_with: astro-rules explain 2026-11-08 (Lahiri, mean node, whole sign); not yet checked in JHora
