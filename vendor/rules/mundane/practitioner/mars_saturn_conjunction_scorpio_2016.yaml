    Mars is in Scorpio 15.8 deg and Saturn is in Scorpio 15.8 deg: 0.0 deg apart, within the 10 deg orb;
    in_sign(planet=Saturn, signs=[Scorpio]): Saturn is in Scorpio 15.8 deg, one of Scorpio; in_sign(planet=Mars,
