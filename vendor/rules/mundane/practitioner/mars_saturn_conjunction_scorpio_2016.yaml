    in_sign(planet=Saturn, signs=[Scorpio]): Saturn is in Scorpio 22.0 deg, one of Scorpio; in_sign(planet=Mars,
    signs=[Scorpio]): Mars is in Scorpio 14.8 deg, one of Scorpio.'
