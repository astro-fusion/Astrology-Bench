id: mundane.practitioner.mars_saturn_conjunction_scorpio_2016
version: 2
name: 'Mars-Saturn conjunction in Scorpio (2016): war and a political scandal in India'
domain: mundane
claim: The 2016 Mars-Saturn conjunction in Scorpio was read as a 'deadly combination of a big war at many
  places around the world'; with Scorpio the 7th house of India's chart, the same author expected a political
  sex scandal between April and June 2016.
source:
  url: https://astrologicalmusings.com/hindu-new-year-chart-2016-and-forecast-for-india/
  text: astrologicalmusings.com, "Hindu New Year chart 2016 and forecast for India" (2016)
  note: 'Practitioner statement; the page has not yet been opened by a maintainer (checked: false).'
author: astro-research practitioner extraction (2026-11-08)
tier: experimental
status: active
window:
  unit: months
  before: $window_before
  after: $window_after
expected_effect:
  event: armed_conflict_or_political_scandal
  direction: increase
params:
  orb: {value: 10, min: 2, max: 15, step: 1, unit: deg}
  window_before: {value: 0, min: 0, max: 3, step: 1, unit: months}
  window_after: {value: 3, min: 0, max: 6, step: 1, unit: months}
conditions:
  all:
  - conjunct_within:
      planets:
      - Mars
      - Saturn
      orb: $orb
  - in_sign:
      planet: Saturn
      signs:
      - Scorpio
  - in_sign:
      planet: Mars
      signs:
      - Scorpio
reference_cases:
- moment: '2016-04-15T00:00:00Z'
  expect: fires
  note: 'Inside the April-June 2016 window. Engine: conjunct_within(planets=[Mars, Saturn], orb=10.0):
