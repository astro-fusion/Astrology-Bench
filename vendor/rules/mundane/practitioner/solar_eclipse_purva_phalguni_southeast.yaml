  direction: increase
params:
  days_before: {value: 1, min: 0, max: 2, step: 1, unit: days}
  days_after: {value: 1, min: 0, max: 2, step: 1, unit: days}
  window_before: {value: 0, min: 0, max: 3, step: 1, unit: months}
  window_after: {value: 6, min: 0, max: 12, step: 1, unit: months}
conditions:
