id: mundane.core.r025_elemental_classification_of_accident_types
version: 2
name: Elemental Classification of Accident Types
domain: mundane
claim: >-
  Elemental Classification of Accident Types - Fiery (Sun, Mars, Jupiter, Uranus / Aries,
  Leo, Sag): FIRE/EXPLOSION, Sabotage, Collisions, Derailments.
source:
  text: Chapter 4
  chapter: Chapter 4
  app_registry: docs/mundane/rule-registry.yaml
  id: RULE-025
  note: >-
    Chapter refers to the mundane text synthesis behind the AstroFusion registry (attributed
