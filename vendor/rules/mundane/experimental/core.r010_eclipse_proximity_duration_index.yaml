# yaml-language-server: $schema=../../schema.json
id: mundane.core.r010_eclipse_proximity_duration_index
version: 2
name: Eclipse Proximity & Duration Index
domain: mundane
claim: >-
  Eclipse Proximity & Duration Index - Check if target date is in 6-month solar window or
  3-month lunar window.
source:
  text: Chapter 1, Chapter 3 & Chapter 4
  chapter: Chapter 1, Chapter 3 & Chapter 4
  app_registry: docs/mundane/rule-registry.yaml
  id: RULE-010
  note: >-
    Chapter refers to the mundane text synthesis behind the AstroFusion registry (attributed
    to B.V. Raman and M.C. Jain plus classical authors); the book edition is not identified,
    see the export PROVENANCE.
author: AstroFusion mundane rule registry (open export 2026-11-08)
tier: experimental
status: active
conditions:
  any:
  - eclipse_within_days:
      kind: solar
      days_before: $solar_days
      days_after: $solar_days
  - eclipse_within_days:
      kind: lunar
      days_before: $lunar_days
      days_after: $lunar_days
reference_cases:
- moment: '2008-09-01T00:00:00Z'
  expect: fires
  note: 'Chosen date. Engine: eclipse_within_days(kind=solar, days_before=180.0, days_after=180.0):
    total solar eclipse 2008-08-01 magnitude 1.02; annular solar eclipse 2009-01-26 magnitude
    0.96 (180 days before to 180 days after); eclipse_within_days(kind=lunar, days_before=90.0,
    days_after=90.0): partial lunar eclipse 2008-08-16 magnitude 0.81 (90 days before to 90
    days after)'
  verified_with: astro-rules explain 2026-11-08 (Lahiri, mean node, whole sign); not yet
    checked in JHora
params:
  solar_days: {value: 180, min: 0, max: 360, step: 1, unit: days}
  lunar_days: {value: 90, min: 0, max: 180, step: 1, unit: days}
validation:
  status: unvalidated
notes:
  original_condition:
  - Check if target date is in 6-month solar window or 3-month lunar window.
  - Check if interval between solar and lunar eclipses <= 16 days (Paksha Grahan).
  - If dual eclipse within 16 days, apply CRITICAL_DISASTER multiplier (>= 2.5x).
  - Highlight nations intersecting totality/annularity shadow paths.
  original_thresholds:
    solar_window_days: 180
    lunar_window_days: 90
    paksha_fortnight_days: 16
    peak_danger_days: 30
  mapping_status: mapped
  draft_conditions:
    any:
    - date_within_days_of_eclipse:
        kind: solar
        days: 180
    - date_within_days_of_eclipse:
        kind: lunar
        days: 90
    - eclipse_pair_interval_days_lte:
        days: 16
  event_types:
  - eclipse
  confidence_in_app: source_based
  severity_in_app: critical
  validation:
    verdict: KEEP_WITH_CHANGES
    problem: Inconsistent window definitions ($\pm 6$ mo, $\pm 3$ mo, 14-day fortnight)
    normalization: >-
      Unified hierarchical model: Broad window ($\pm 6$ mo), Acute window ($\pm 1$ mo), and
      Paksha Grahan dual-eclipse multiplier ($\le 14$ days).
    kind: architectural_review_verdict
    source_file: docs/mundane/validation-report.md
    empirical_backtest_result: null
  encoding: Encoded 2026-11-08 when the missing predicates (date_within_days_of_eclipse,
    eclipse_pair_interval_days_lte) were added. Solar window +/- 180 days, lunar +/- 90
    days, as registered. With eclipse seasons every ~173 days the solar window alone
    covers nearly every day, so the indicator is almost always on; that is a property of
    the rule, recorded here rather than changed. The 16-day pair branch is inside the
    solar window and adds nothing.
