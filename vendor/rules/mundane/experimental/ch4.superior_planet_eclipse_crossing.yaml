# yaml-language-server: $schema=../../schema.json
id: mundane.ch4.superior_planet_eclipse_crossing
version: 2
name: Superior Planet Exact Eclipse-Crossing Trigger
domain: mundane
claim: >-
  Superior Planet Exact Eclipse-Crossing Trigger - Transiting superior planet conjuncts (0
  deg) or opposes (180 deg) stored eclipse longitude within 3.0 deg.
source:
  text: Chapter 4
  chapter: Chapter 4
  app_registry: docs/mundane/chapter4-rule-registry.yaml
  id: ch4_superior_planet_eclipse_crossing
  note: >-
    Chapter refers to the mundane text synthesis behind the AstroFusion registry (attributed
    to B.V. Raman and M.C. Jain plus classical authors); the book edition is not identified,
    see the export PROVENANCE.
author: AstroFusion mundane rule registry (open export 2026-11-08)
tier: experimental
status: active
params:
  orb: {value: 3, min: 0.5, max: 6, step: 0.5, unit: deg}
  lookback_days: {value: 365, min: 90, max: 730, step: 30, unit: days}
conditions:
  eclipse_degree_transited_by:
    planets:
    - Mars
    - Jupiter
    - Saturn
    orb: $orb
    angles:
    - 0
    - 180
    lookback_days: $lookback_days
reference_cases:
- moment: '2000-01-01T00:00:00Z'
  expect: fires
  note: 'First firing moment found by a scan. Engine: eclipse_degree_transited_by(planets=[Mars,
    Jupiter, Saturn], orb=3.0, angles=[0.0, 180.0], lookback_days=365.0): Mars 0.4 deg from 0
    to the solar eclipse degree Aquarius 3.3 deg of 1999-02-16'
  verified_with: astro-rules explain 2026-11-08 (Lahiri, mean node, whole sign); not yet
    checked in JHora
- moment: '2000-01-06T00:00:00Z'
  expect: silent
  note: 'A silent moment found by a scan. Engine: eclipse_degree_transited_by(planets=[Mars, Jupiter,
    Saturn], orb=3.0, angles=[0.0, 180.0], lookback_days=365.0): closest: Mars 4.3 deg from 0
    to the solar eclipse degree Aquarius 3.3 deg of 1999-02-16 (orb 3)'
  verified_with: astro-rules explain 2026-11-08 (Lahiri, mean node, whole sign); not yet
    checked in JHora
validation:
  status: unvalidated
notes:
  original_condition:
  - >-
    Transiting superior planet conjuncts (0 deg) or opposes (180 deg) stored eclipse longitude
    within 3.0 deg.
  - >-
    Distinguish applying (high weight), exact (peak weight), and separating (decaying weight)
    phases.
  original_thresholds:
    trigger_orb_deg: 3
    monitored_planets:
    - Mars
    - Saturn
    - Uranus
    - Pluto
  mapping_status: mapped
  draft_conditions:
    any:
    - transit_over_eclipse_degree:
        planet: Mars
        aspects:
        - 0
        - 180
        orb: 3
    - transit_over_eclipse_degree:
        planet: Saturn
        aspects:
        - 0
        - 180
        orb: 3
    - transit_over_eclipse_degree:
        planet: Uranus
        aspects:
        - 0
        - 180
        orb: 3
    - transit_over_eclipse_degree:
        planet: Pluto
        aspects:
        - 0
        - 180
        orb: 3
  event_types:
  - collision_derailment
  - sabotage_or_sudden_mechanical_failure
  confidence_in_app: source_based
  severity_in_app: high
  validation:
    verdict: KEEP_WITH_CHANGES
    problem: Sign-only matching is too coarse.
    normalization: >-
      Use exact stored eclipse degree $\pm 3^\circ$ orb. Differentiate applying, exact, and
      separating crossings.
    kind: architectural_review_verdict
    source_file: docs/mundane/chapter4-validation-report.md
    empirical_backtest_result: null
  encoding: "Encoded 2026-11-08 when the missing predicates (transit_over_eclipse_degree) were
    added. Superior planets in the vocabulary: Mars, Jupiter, Saturn (Uranus, Neptune and Pluto
    are not available). 'Stored eclipse longitude' read as any eclipse in the previous $lookback_days.
    Applying versus separating phases are not distinguished."
