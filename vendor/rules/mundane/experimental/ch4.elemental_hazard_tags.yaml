# yaml-language-server: $schema=../../schema.json
id: mundane.ch4.elemental_hazard_tags
version: 2
name: Elemental Classification of Accident Hazards
domain: mundane
claim: >-
  Elemental Classification of Accident Hazards - If fiery planets or fiery signs afflicted:
  assign fire_explosion (0.8), collision_derailment (0.7).
source:
  text: Chapter 4
  chapter: Chapter 4
  app_registry: docs/mundane/chapter4-rule-registry.yaml
  id: ch4_elemental_hazard_tags
  note: >-
    Chapter refers to the mundane text synthesis behind the AstroFusion registry (attributed
    to B.V. Raman and M.C. Jain plus classical authors); the book edition is not identified,
    see the export PROVENANCE.
author: AstroFusion mundane rule registry (open export 2026-11-08)
tier: experimental
status: active
params:
  count: {value: 2, min: 1, max: 4, step: 1, unit: count}
conditions:
  any:
  - afflicted_element:
      element: fire
      count_gte: $count
  - afflicted_element:
      element: water
      count_gte: $count
  - afflicted_element:
      element: air
      count_gte: $count
reference_cases:
- moment: '2000-01-01T00:00:00Z'
  expect: fires
  note: 'First firing moment found by a scan. Engine: afflicted_element(element=fire, count_gte=2):
    malefics in fire signs (Aries, Leo, Sagittarius): Sun in Sagittarius, Saturn in Aries (2 needed);
    afflicted_element(element=water, count_gte=2): malefics in water signs (Cancer, Scorpio, Pisces):
    Rahu in Cancer (2 needed); afflicted_element(element=air, count_gte=2): malefics in air signs
    (Gemini, Libra, Aquarius): Mars in Aquarius (2 needed)'
  verified_with: astro-rules explain 2026-11-08 (Lahiri, mean node, whole sign); not yet
    checked in JHora
- moment: '2000-01-15T00:00:00Z'
  expect: silent
  note: 'A silent moment found by a scan. Engine: afflicted_element(element=fire, count_gte=2):
    malefics in fire signs (Aries, Leo, Sagittarius): Saturn in Aries (2 needed); afflicted_element(element=water,
    count_gte=2): malefics in water signs (Cancer, Scorpio, Pisces): Rahu in Cancer (2 needed);
    afflicted_element(element=air, count_gte=2): malefics in air signs (Gemini, Libra, Aquarius):
    Mars in Aquarius (2 needed)'
  verified_with: astro-rules explain 2026-11-08 (Lahiri, mean node, whole sign); not yet
    checked in JHora
validation:
  status: unvalidated
notes:
  original_condition:
  - If fiery planets or fiery signs afflicted: assign fire_explosion (0.8),
      collision_derailment (0.7).
  - If watery planets or watery signs afflicted: assign water_hazard (0.8), bridge_river_risk
      (0.7), track_flooding_risk (0.6).
  - If airy signs afflicted: assign wind_gas_air (0.7), signal_communication_error (0.6).
  original_thresholds:
    fiery_signs:
    - 1
    - 5
    - 9
    earthy_signs:
    - 2
    - 6
    - 10
    airy_signs:
    - 3
    - 7
    - 11
    watery_signs:
    - 4
    - 8
    - 12
    fiery_planets:
    - Sun
    - Mars
    - Jupiter
    - Uranus
    watery_planets:
    - Moon
    - Venus
    - Neptune
    airy_planets:
    - Mercury
    - Saturn
  mapping_status: mapped
  draft_conditions:
    any:
    - afflicted_element:
        element: fire
        planets:
        - Sun
        - Mars
        - Jupiter
        - Uranus
        signs:
        - 1
        - 5
        - 9
    - afflicted_element:
        element: water
        planets:
        - Moon
        - Venus
        - Neptune
        signs:
        - 4
        - 8
        - 12
    - afflicted_element:
        element: air
        planets:
        - Mercury
        - Saturn
        signs:
        - 3
        - 7
        - 11
  event_types:
  - fire_explosion
  - water_hazard
  - wind_gas_air
  - collision_derailment
  confidence_in_app: traditional_only
  severity_in_app: elevated
  validation:
    verdict: CORRECT & NORMALIZE
    problem: Incorrectly lists Capricorn as a "watery sign"; binary single accident type.
    normalization: >-
      Correct Capricorn to Earth; output weighted hazard tags: `fire_explosion`, `water_hazard`,
      `wind_gas_air`, `collision_derailment`.
    kind: architectural_review_verdict
    source_file: docs/mundane/chapter4-validation-report.md
    empirical_backtest_result: null
  encoding: Encoded 2026-11-08 when the missing predicates (afflicted_element) were added.
    'afflicted' read as occupation of the element's signs by at least $count natural malefics
    (Sun, Mars, Saturn, Rahu, Ketu). The planet lists of the draft (Uranus, Neptune) and the
    'fiery planets' reading are not encoded; outer planets are not in the vocabulary.
